name: Bug report
description: Something is broken in the app or the build toolchain.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much as you can — the more detail, the faster we can reproduce and fix it.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short description of the bug. What did you do, and what went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A numbered list of steps that reliably triggers the bug.
      placeholder: |
        1. Open the app
        2. Go to the Settings tab
        3. Toggle "Squat" off
        4. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Screenshots or a screen recording help a lot.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Android or iOS? Device model and OS version?
      placeholder: "Android 14, Pixel 8 Pro"
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App / build version
      description: Visible in Settings → About, or the EAS build number if you have it.
      placeholder: "1.0.0 / EAS build 42"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste any Metro or native logs here. Use a code block.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I can reliably reproduce this bug.
          required: false

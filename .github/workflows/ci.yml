name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: expo-doctor
        run: pnpm run expo-doctor

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Jest
        run: pnpm test

  web:
    name: Astro web build
    runs-on: ubuntu-latest
    needs: static
    # Vercel auto-builds on push to main, but that runs AFTER merge — a
    # broken frontmatter / MDX file would land in production before the
    # PR review notices. This step catches it at PR time.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Astro build
        run: pnpm build:web

  bundle:
    name: Metro bundle check
    runs-on: ubuntu-latest
    needs: static
    # Closes the harness gap documented in CLAUDE.md: pnpm test/typecheck/lint
    # never load the Metro bundler, so a runtime dep missing from the install
    # graph passes those checks but breaks `expo start`. This step runs the
    # iOS export so CI catches that drift before it lands on main.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Expo Metro bundle
        run: pnpm bundle-check

  perf:
    name: Reassure perf
    runs-on: ubuntu-latest
    needs: static
    # Plate variants must each render in under 4ms @ 225 lb and may not
    # regress >10% from the baseline measured on main. Reassure surfaces
    # regressions via the comparison step below; CI fails on regression.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reassure baseline (main)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git switch --detach FETCH_HEAD
          pnpm install --frozen-lockfile
          pnpm --filter @fivethreeone/mobile run perf:baseline
          git switch --detach -

      - name: Reassure current
        if: github.event_name == 'pull_request'
        run: pnpm --filter @fivethreeone/mobile run perf

      - name: Enforce perf budget (4ms render, +10% regression cap)
        if: github.event_name == 'pull_request'
        run: |
          node -e '
            const fs = require("fs");
            const report = JSON.parse(
              fs.readFileSync("apps/mobile/.reassure/output.json", "utf8")
            );
            const HARD_MS = 4;
            const REGRESS_PCT = 0.10;
            const failures = [];
            const check = (entry) => {
              const name = entry.name + " [" + entry.type + "]";
              const curr = entry.current?.meanDuration;
              const base = entry.baseline?.meanDuration;
              if (typeof curr === "number" && curr > HARD_MS) {
                failures.push(`${name}: ${curr.toFixed(2)}ms > ${HARD_MS}ms hard budget`);
              }
              if (typeof curr === "number" && typeof base === "number" && base > 0) {
                const delta = (curr - base) / base;
                if (delta > REGRESS_PCT) {
                  failures.push(
                    `${name}: regressed ${(delta * 100).toFixed(1)}% (>${REGRESS_PCT * 100}%) — ${base.toFixed(2)}ms → ${curr.toFixed(2)}ms`
                  );
                }
              }
            };
            for (const entry of report.significant || []) check(entry);
            for (const entry of report.meaningless || []) check(entry);
            if (failures.length) {
              console.error("Perf budget violations:\n - " + failures.join("\n - "));
              process.exit(1);
            }
            console.log("Perf budget OK.");
          '

      - name: Reassure baseline (push to main)
        if: github.event_name == 'push'
        run: pnpm --filter @fivethreeone/mobile run perf:baseline

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reassure-report
          path: apps/mobile/.reassure/
          if-no-files-found: ignore


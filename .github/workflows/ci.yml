name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: expo-doctor
        run: pnpm run expo-doctor

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Jest
        run: pnpm test

  web:
    name: Astro web build
    runs-on: ubuntu-latest
    needs: static
    # Vercel auto-builds on push to main, but that runs AFTER merge — a
    # broken frontmatter / MDX file would land in production before the
    # PR review notices. This step catches it at PR time.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Astro build
        run: pnpm build:web

  bundle:
    name: Metro bundle check
    runs-on: ubuntu-latest
    needs: static
    # Closes the harness gap documented in CLAUDE.md: pnpm test/typecheck/lint
    # never load the Metro bundler, so a runtime dep missing from the install
    # graph passes those checks but breaks `expo start`. This step runs the
    # iOS export so CI catches that drift before it lands on main.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Expo Metro bundle
        run: pnpm bundle-check



name: Preview APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build:
    name: Build & release preview APK
    runs-on: ubuntu-latest
    # A cold Gradle release build on the runner takes ~15-25 min; give it room
    # but don't let a hung build burn the default 6h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `eas build --local` runs a real Android release build here on the
      # runner (expo prebuild + Gradle), so the JDK must match what Expo SDK
      # 55 / RN 0.83 expects. ubuntu-latest ships the Android SDK + NDK with
      # $ANDROID_HOME already set; Gradle picks those up.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Hash the files that affect the native fingerprint: config, deps, and
      # any native Android source. Pure JS/TS changes are handled by OTA
      # (ota.yml) and don't need a new APK.
      - name: Compute native fingerprint
        id: fp
        run: |
          HASH=$(cat \
            apps/mobile/app.json \
            apps/mobile/app.config.ts 2>/dev/null \
            pnpm-lock.yaml \
            | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Fingerprint: $HASH"

      - name: Check last release fingerprint
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_BODY=$(gh release list --limit 1 --json body --jq '.[0].body' 2>/dev/null || echo "")
          if echo "$LAST_BODY" | grep -qF "fingerprint: ${{ steps.fp.outputs.hash }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Fingerprint unchanged — native build not needed (OTA covers this push)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Fingerprint changed — building new APK"
          fi

      - name: Toolchain versions
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "JAVA_HOME=$JAVA_HOME"; java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build preview APK on runner (eas build --local)
        id: build
        if: steps.gate.outputs.skip != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # --local runs the Android release build on this runner instead of
          # EAS cloud. Signing credentials (the keystore) stay managed by EAS
          # and are downloaded at build time via EXPO_TOKEN — no keystore
          # secret lives on the runner. stderr is intentionally NOT suppressed
          # so a failure is diagnosable straight from the run logs.
          pnpm --filter @fivethreeone/mobile exec eas build \
            --profile preview \
            --platform android \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/531-preview.apk"

      - name: Publish GitHub Release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          TAG="preview-$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}"
          NOTES=$(printf "fingerprint: ${{ steps.fp.outputs.hash }}\n\nBuilt from commit: ${{ github.sha }}")
          gh release create "$TAG" \
            "$RUNNER_TEMP/531-preview.apk#531-preview.apk" \
            --title "Preview ${SHORT_SHA}" \
            --notes "$NOTES" \
            --prerelease

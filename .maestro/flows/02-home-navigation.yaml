---
# Smoke test: tab navigation from the home screen.
# Assumes onboarding was already completed (run after 01-onboarding or on a configured device).

appId: com.alexcheuk.fivethreeone.dev
---
- launchApp

# Home tab is default
- assertVisible:
    id: "home-lift-carousel"

# Navigate to Progress tab
- tapOn:
    id: "tab-progress"
- waitForAnimationToEnd
- assertVisible:
    id: "progress-screen"

# Navigate to History tab
- tapOn:
    id: "tab-history"
- waitForAnimationToEnd
- assertVisible:
    id: "history-screen"

# Navigate to Settings tab
- tapOn:
    id: "tab-settings"
- waitForAnimationToEnd
- assertVisible:
    id: "settings-scroll"

# Return to Home
- tapOn:
    id: "tab-index"
- waitForAnimationToEnd
- assertVisible:
    id: "home-lift-carousel"
